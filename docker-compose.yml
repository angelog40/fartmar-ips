services:
  db:
    image: postgres:16-alpine
    container_name: fartmar_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-fartmar}
      POSTGRES_USER: ${DB_USERNAME:-fartmar_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fartmar_secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-fartmar_user} -d ${DB_DATABASE:-fartmar}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fartmar_api
    restart: unless-stopped
    env_file:
      - ./backend/.env.example
    ports:
      - "8000:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fartmar_frontend
    restart: unless-stopped
    ports:
      - "5173:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata: